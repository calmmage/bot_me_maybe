[tool.poetry]
name = "bmmb"
version = "0.1.0"
description = "BotMeMaybe - a collection of utils for easy bot development"
authors = ["Petr Lavrov <petr.b.lavrov@gmail.com>"]
readme = "README.md"
license = "LICENSE"
classifiers = [
    "Programming Language :: Python :: 3",
]

[tool.poetry.dependencies]
python = "^3.8"
pytest = "^6.2.2"
toml = "^0.10.2"
mongoengine = "*"
python-telegram-bot = "*"
aiogram = "*"
loguru = "*"
logger_master = "*"
python-dotenv = "*"
pydantic = "*"

[tool.poetry.extras]
pyrogram = ["pyrogram"]
full = ["pyrogram", "injector"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

